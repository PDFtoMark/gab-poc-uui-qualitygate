name: quality_gate
on:
    pull_request:
        branches:
            - main
env:
    REPORT_1_ARTIFACT: qualityGateReports_file1
    REPORT_2_ARTIFACT: qualityGateReports_file2
    PR_NUM_ARTIFACT: qualityGateReports_pr
jobs:
    quality_gate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: 'Prepare artifact (attacker chooses the target PR)'
              shell: bash
              run: |
                  echo 2 > ./${{ env.PR_NUM_ARTIFACT }}
            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.PR_NUM_ARTIFACT }}
                  path: ./${{ env.PR_NUM_ARTIFACT }}
                  retention-days: 1
            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.REPORT_1_ARTIFACT }}
                  path: ./.reports/trackBundleSize.md
                  retention-days: 1
            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.REPORT_2_ARTIFACT }}
                  path: ./.reports/generateComponentsApiStats.md
                  retention-days: 1
